services:
  benchmarkdb:
    container_name: benchmarkdb
    image: postgis/postgis:16-3.5

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark_db

    ports:
      - "${MAPPED_POSTGRES_PORT}:5432"

    volumes:
      - benchmark_pgdata:/var/lib/postgresql/data
      - ./db_import:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h benchmarkdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ontop:
    container_name: ontop
    image: albulenpano/geosparql_1.1:v8
    restart: unless-stopped

    environment:
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/benchmark.ttl
      ONTOP_MAPPING_FILE: /opt/ontop/input/benchmark.obda
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/benchmark.properties
      #ONTOP_LENSES_FILE: /opt/ontop/input/lens_2.json
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
      ONTOP_LOG_LEVEL: "DEBUG"

    volumes:
      - ./vkg:/opt/ontop/input:ro
      - ./jdbc:/opt/ontop/jdbc:ro

    ports:
      - "${SERVER_PORT:-8080}:8080"

    depends_on:
      benchmarkdb:
        condition: service_healthy

volumes:
  benchmark_pgdata: